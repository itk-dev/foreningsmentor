name: "Address DAWA"
description: "Field type, widget, and formatter for Danish postal addresses. Originally backed by DAWA; now backed by SDFI Adressevælger (adressevaelger.dk). The machine name and plugin ids are kept for historical reasons so existing field configuration and data continue to work without migration."
type: module
core_version_requirement: ^10 || ^11
package: "Foreningsmentor"
dependencies:
  - drupal:field
